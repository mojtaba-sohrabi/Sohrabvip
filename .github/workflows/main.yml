name: "Update Content Every 30 Minutes"

on:
  # اجرای دستی از طریق دکمه Run workflow
  workflow_dispatch:
  # زمانبندی: هر 30 دقیقه یکبار
  schedule:
    - cron: '*/30 * * * *'

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # دریافت کدهای مخزن
      - name: Checkout repository
        uses: actions/checkout@v4

      # دانلود محتوا از لینک و ذخیره در test.txt
      - name: Download content to test.txt
        run: |
          curl -L https://key.zarazaex.xyz/sub/ -o test.txt

      # اعمال تغییرات در GitHub
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: $(date '+%Y-%m-%d %H:%M:%S')"
          git push
